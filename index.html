<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stock Battle 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Prevent zoom on input focus on iOS */
        input {
            font-size: 16px;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div id="root"></div>

    <script>
        // Get the server URL (works for both local and network access)
        const API_URL = window.location.origin;

        class StockTracker {
            constructor() {
                this.players = [
                    {
                        name: 'Zach M',
                        color: 'from-blue-500 to-blue-600',
                        borderColor: 'border-blue-400',
                        longs: [
                            { symbol: '', buyPrice: null, currentPrice: null, shares: null },
                            { symbol: '', buyPrice: null, currentPrice: null, shares: null },
                            { symbol: '', buyPrice: null, currentPrice: null, shares: null }
                        ],
                        shorts: [
                            { symbol: '', buyPrice: null, currentPrice: null, shares: null },
                            { symbol: '', buyPrice: null, currentPrice: null, shares: null },
                            { symbol: '', buyPrice: null, currentPrice: null, shares: null }
                        ]
                    },
                    {
                        name: 'Zach O',
                        color: 'from-purple-500 to-purple-600',
                        borderColor: 'border-purple-400',
                        longs: [
                            { symbol: '', buyPrice: null, currentPrice: null, shares: null },
                            { symbol: '', buyPrice: null, currentPrice: null, shares: null },
                            { symbol: '', buyPrice: null, currentPrice: null, shares: null }
                        ],
                        shorts: [
                            { symbol: '', buyPrice: null, currentPrice: null, shares: null },
                            { symbol: '', buyPrice: null, currentPrice: null, shares: null },
                            { symbol: '', buyPrice: null, currentPrice: null, shares: null }
                        ]
                    },
                    {
                        name: 'Zach D',
                        color: 'from-green-500 to-green-600',
                        borderColor: 'border-green-400',
                        longs: [
                            { symbol: '', buyPrice: null, currentPrice: null, shares: null },
                            { symbol: '', buyPrice: null, currentPrice: null, shares: null },
                            { symbol: '', buyPrice: null, currentPrice: null, shares: null }
                        ],
                        shorts: [
                            { symbol: '', buyPrice: null, currentPrice: null, shares: null },
                            { symbol: '', buyPrice: null, currentPrice: null, shares: null },
                            { symbol: '', buyPrice: null, currentPrice: null, shares: null }
                        ]
                    },
                    {
                        name: 'Matt',
                        color: 'from-orange-500 to-orange-600',
                        borderColor: 'border-orange-400',
                        longs: [
                            { symbol: '', buyPrice: null, currentPrice: null, shares: null },
                            { symbol: '', buyPrice: null, currentPrice: null, shares: null },
                            { symbol: '', buyPrice: null, currentPrice: null, shares: null }
                        ],
                        shorts: [
                            { symbol: '', buyPrice: null, currentPrice: null, shares: null },
                            { symbol: '', buyPrice: null, currentPrice: null, shares: null },
                            { symbol: '', buyPrice: null, currentPrice: null, shares: null }
                        ]
                    }
                ];
                
                this.lastUpdate = new Date();
                this.loadFromStorage();
                this.render();
            }

            saveToStorage() {
                localStorage.setItem('stockBattleData', JSON.stringify(this.players));
            }

            loadFromStorage() {
                const saved = localStorage.getItem('stockBattleData');
                if (saved) {
                    try {
                        this.players = JSON.parse(saved);
                    } catch (e) {
                        console.error('Error loading saved data:', e);
                    }
                }
            }

            async fetchStockPrice(symbol) {
                try {
                    const response = await fetch(`${API_URL}/api/price/${symbol}`);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const data = await response.json();
                    if (data.error) {
                        console.error(`Error from API: ${data.error}`);
                        return null;
                    }
                    return data.price || null;
                } catch (error) {
                    console.error(`Error fetching price for ${symbol}:`, error);
                    return null;
                }
            }

            async updateSymbol(playerIndex, type, posIndex, symbol) {
                const player = this.players[playerIndex];
                const position = player[type][posIndex];
                
                position.symbol = symbol;
                this.render(); // Update immediately with the symbol
                this.saveToStorage();

                if (symbol) {
                    // Add small delay to avoid rate limiting
                    await new Promise(resolve => setTimeout(resolve, 500));
                    
                    const price = await this.fetchStockPrice(symbol);
                    
                    if (price) {
                        if (position.buyPrice === null) {
                            position.buyPrice = price;
                            position.shares = 100 / price;
                        }
                        position.currentPrice = price;
                        this.render(); // Re-render after price is fetched
                        this.saveToStorage();
                    } else {
                        // Show error if price couldn't be fetched
                        alert(`Could not fetch price for ${symbol}. Please check the ticker symbol and try again.`);
                        position.symbol = '';
                        this.render();
                        this.saveToStorage();
                    }
                }
            }

            async refreshAllPrices() {
                // Show loading state
                this.lastUpdate = new Date();
                this.render();
                
                const symbols = new Set();
                
                // Collect all symbols
                this.players.forEach(player => {
                    player.longs.forEach(pos => { if (pos.symbol) symbols.add(pos.symbol); });
                    player.shorts.forEach(pos => { if (pos.symbol) symbols.add(pos.symbol); });
                });

                if (symbols.size === 0) {
                    alert('No stocks entered yet!');
                    return;
                }

                // Fetch prices for all symbols with delays to avoid rate limiting
                const symbolsArray = Array.from(symbols);
                const priceMap = {};
                
                for (const symbol of symbolsArray) {
                    const price = await this.fetchStockPrice(symbol);
                    if (price) {
                        priceMap[symbol] = price;
                    }
                    // Small delay between requests
                    await new Promise(resolve => setTimeout(resolve, 300));
                }

                // Update all positions
                this.players.forEach(player => {
                    player.longs.forEach(pos => {
                        if (pos.symbol && priceMap[pos.symbol]) {
                            pos.currentPrice = priceMap[pos.symbol];
                        }
                    });
                    player.shorts.forEach(pos => {
                        if (pos.symbol && priceMap[pos.symbol]) {
                            pos.currentPrice = priceMap[pos.symbol];
                        }
                    });
                });

                this.lastUpdate = new Date();
                this.saveToStorage();
                this.render(); // Final render with all updated prices
            }

            calculateReturn(position, isShort = false) {
                const buy = parseFloat(position.buyPrice);
                const current = parseFloat(position.currentPrice);
                const shares = parseFloat(position.shares);
                
                if (!buy || !current || !shares) return 0;
                
                if (isShort) {
                    return (buy - current) * shares;
                } else {
                    return (current - buy) * shares;
                }
            }

            calculateTotalReturn(player) {
                let total = 0;
                player.longs.forEach(pos => {
                    total += this.calculateReturn(pos, false);
                });
                player.shorts.forEach(pos => {
                    total += this.calculateReturn(pos, true);
                });
                return total;
            }

            render() {
                const rankings = [...this.players]
                    .map((player, idx) => ({
                        ...player,
                        originalIndex: idx,
                        totalReturn: this.calculateTotalReturn(player)
                    }))
                    .sort((a, b) => b.totalReturn - a.totalReturn);

                const winner = rankings[0];

                document.getElementById('root').innerHTML = `
                    <div class="min-h-screen p-3 md:p-6">
                        <div class="max-w-7xl mx-auto">
                            <!-- Header -->
                            <div class="text-center mb-4 md:mb-8">
                                <div class="flex items-center justify-center gap-2 md:gap-3 mb-3 md:mb-4">
                                    <svg class="w-8 h-8 md:w-10 md:h-10 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
                                    </svg>
                                    <h1 class="text-3xl md:text-5xl font-bold text-white">Stock Battle 2026</h1>
                                    <svg class="w-8 h-8 md:w-10 md:h-10 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
                                    </svg>
                                </div>
                                <p class="text-gray-400 text-sm md:text-lg">Competition ends Dec 31, 2026 • $100 per stock</p>
                                <div class="flex flex-col sm:flex-row items-center justify-center gap-2 mt-3 md:mt-4">
                                    <button onclick="tracker.refreshAllPrices()" class="w-full sm:w-auto flex items-center justify-center gap-2 px-4 md:px-6 py-2 md:py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors font-semibold text-sm md:text-base">
                                        <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                                        </svg>
                                        Refresh All Prices
                                    </button>
                                </div>
                                <div class="text-gray-400 text-xs md:text-sm mt-2">
                                    Last Updated: ${this.lastUpdate.toLocaleTimeString()}
                                </div>
                            </div>

                            <!-- Leaderboard -->
                            <div class="bg-gradient-to-r from-yellow-500/20 to-yellow-600/20 border-2 border-yellow-500/50 rounded-xl p-3 md:p-6 mb-4 md:mb-8">
                                <h2 class="text-lg md:text-2xl font-bold text-white mb-3 md:mb-4 flex items-center gap-2">
                                    <svg class="w-5 h-5 md:w-6 md:h-6 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
                                    </svg>
                                    Leader: ${winner.name}
                                </h2>
                                <div class="grid grid-cols-2 md:grid-cols-4 gap-2 md:gap-4">
                                    ${rankings.map((player, idx) => `
                                        <div class="bg-slate-800/50 rounded-lg p-2 md:p-4 border-2 ${idx === 0 ? 'border-yellow-400' : 'border-slate-600'}">
                                            <div class="text-xs md:text-sm text-gray-400 mb-1">#{idx + 1}</div>
                                            <div class="text-sm md:text-lg font-bold text-white mb-1 md:mb-2">${player.name}</div>
                                            <div class="text-base md:text-2xl font-bold ${player.totalReturn >= 0 ? 'text-green-400' : 'text-red-400'}">
                                                ${player.totalReturn >= 0 ? '+' : ''}$${player.totalReturn.toFixed(2)}
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <!-- Player Cards -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-6">
                                ${this.players.map((player, playerIndex) => this.renderPlayerCard(player, playerIndex)).join('')}
                            </div>
                        </div>
                    </div>
                `;

                // Add event listeners for inputs
                this.players.forEach((player, playerIndex) => {
                    player.longs.forEach((pos, posIndex) => {
                        const input = document.getElementById(`long-${playerIndex}-${posIndex}`);
                        if (input) {
                            input.addEventListener('change', (e) => {
                                this.updateSymbol(playerIndex, 'longs', posIndex, e.target.value.toUpperCase());
                            });
                        }
                    });
                    player.shorts.forEach((pos, posIndex) => {
                        const input = document.getElementById(`short-${playerIndex}-${posIndex}`);
                        if (input) {
                            input.addEventListener('change', (e) => {
                                this.updateSymbol(playerIndex, 'shorts', posIndex, e.target.value.toUpperCase());
                            });
                        }
                    });
                });
            }

            renderPlayerCard(player, playerIndex) {
                const totalReturn = this.calculateTotalReturn(player);
                
                return `
                    <div class="bg-slate-800/80 backdrop-blur rounded-xl border-2 ${player.borderColor} overflow-hidden">
                        <div class="bg-gradient-to-r ${player.color} p-3 md:p-4">
                            <h3 class="text-xl md:text-2xl font-bold text-white">${player.name}</h3>
                            <div class="text-white/90 text-xs md:text-sm mt-1">
                                Total Return: 
                                <span class="ml-1 md:ml-2 text-base md:text-lg font-bold ${totalReturn >= 0 ? 'text-green-200' : 'text-red-200'}">
                                    ${totalReturn >= 0 ? '+' : ''}$${totalReturn.toFixed(2)}
                                </span>
                            </div>
                        </div>

                        <div class="p-3 md:p-4">
                            <!-- Long Positions -->
                            <div class="mb-3 md:mb-4">
                                <div class="flex items-center gap-2 mb-2 md:mb-3">
                                    <svg class="w-4 h-4 md:w-5 md:h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
                                    </svg>
                                    <h4 class="text-base md:text-lg font-semibold text-white">Long Positions</h4>
                                </div>
                                ${player.longs.map((position, posIndex) => this.renderPosition(position, playerIndex, posIndex, 'long', false)).join('')}
                            </div>

                            <!-- Short Positions -->
                            <div>
                                <div class="flex items-center gap-2 mb-2 md:mb-3">
                                    <svg class="w-4 h-4 md:w-5 md:h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6"/>
                                    </svg>
                                    <h4 class="text-base md:text-lg font-semibold text-white">Short Positions</h4>
                                </div>
                                ${player.shorts.map((position, posIndex) => this.renderPosition(position, playerIndex, posIndex, 'short', true)).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            renderPosition(position, playerIndex, posIndex, type, isShort) {
                const returnValue = this.calculateReturn(position, isShort);
                const percentReturn = position.buyPrice && position.currentPrice 
                    ? (isShort 
                        ? ((position.buyPrice - position.currentPrice) / position.buyPrice * 100)
                        : ((position.currentPrice - position.buyPrice) / position.buyPrice * 100))
                    : 0;

                return `
                    <div class="bg-slate-700/50 rounded-lg p-2 md:p-3 mb-2">
                        <div class="flex gap-2 items-center">
                            <input
                                type="text"
                                id="${type}-${playerIndex}-${posIndex}"
                                placeholder="Enter Ticker"
                                value="${position.symbol}"
                                class="flex-1 bg-slate-600 text-white rounded px-2 md:px-3 py-1.5 md:py-2 text-sm uppercase font-semibold"
                            />
                            ${position.symbol && !position.buyPrice ? `
                                <svg class="w-4 h-4 md:w-5 md:h-5 text-blue-400 animate-spin" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                            ` : ''}
                        </div>
                        ${position.symbol && position.buyPrice ? `
                            <div class="mt-2 text-xs md:text-sm space-y-1">
                                <div class="flex justify-between text-gray-400">
                                    <span>${isShort ? 'Short' : 'Entry'}: $${position.buyPrice.toFixed(2)}</span>
                                    <span>Current: $${position.currentPrice?.toFixed(2) || '—'}</span>
                                </div>
                                <div class="flex justify-between text-gray-400">
                                    <span>Shares: ${position.shares?.toFixed(4)}</span>
                                    <span class="font-semibold ${percentReturn >= 0 ? 'text-green-400' : 'text-red-400'}">
                                        ${percentReturn >= 0 ? '+' : ''}${percentReturn.toFixed(2)}%
                                    </span>
                                </div>
                                <div class="text-right text-base md:text-lg font-bold ${returnValue >= 0 ? 'text-green-400' : 'text-red-400'}">
                                    ${returnValue >= 0 ? '+' : ''}$${returnValue.toFixed(2)}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }
        }

        // Initialize the tracker
        let tracker;
        window.addEventListener('DOMContentLoaded', () => {
            tracker = new StockTracker();
        });
    </script>
</body>
</html>
